{# Simple line icons, drawn with the text colour. #}
{% macro icon(name) -%}
<svg class="icon" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
  {% if name == "home" %}
    <path d="M4 11.5 12 4l8 7.5"/><path d="M6 10v9h12v-9"/><path d="M10 19v-5h4v5"/>
  {% elif name == "list" %}
    <path d="M8 6h12M8 12h12M8 18h12"/><path d="M4 6h.01M4 12h.01M4 18h.01"/>
  {% elif name == "plus" %}
    <path d="M12 5v14M5 12h14"/>
  {% elif name == "back" %}
    <path d="M15 5l-7 7 7 7"/>
  {% elif name == "sun" %}
    <circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6 7 7M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/>
  {% elif name == "moon" %}
    <path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5Z"/>
  {% elif name == "auto" %}
    <circle cx="12" cy="12" r="8"/><path d="M12 4v16" /><path d="M12 4a8 8 0 0 1 0 16Z" fill="currentColor"/>
  {% elif name == "budget" %}
    <path d="M4 17a8 8 0 0 1 16 0"/><path d="M12 17l4-5"/><path d="M4 20h16"/>
  {% elif name == "year" %}
    <rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/><path d="M8 14h2M14 14h2M8 17h2"/>
  {% elif name == "chart" %}
    <path d="M5 20V10M12 20V4M19 20v-7"/><path d="M3 20h18"/>
  {% elif name == "jar" %}
    <path d="M8 3h8M7 6h10"/><path d="M7 6c-2 2-2 4-2 6v6a3 3 0 0 0 3 3h8a3 3 0 0 0 3-3v-6c0-2 0-4-2-6"/><path d="M5 12h14"/>
  {% elif name == "gear" %}
    <circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/>
  {% elif name == "next" %}
    <path d="M9 5l7 7-7 7"/>
  {% endif %}
</svg>
{%- endmacro %}
